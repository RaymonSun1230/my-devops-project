{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.rollout.canaryReplicas | default .Values.replicaCount }}
  strategy:
    canary:
      maxSurge: {{ .Values.rollout.canaryMaxSurge | default "25%" }}
      maxUnavailable: {{ .Values.rollout.canaryMaxUnavailable | default 0 }}
      dynamicStableScale: {{ .Values.rollout.dynamicStableScale | default false }}
      {{- if .Values.rollout.trafficRouting }}
      canaryService: {{ include "frontend.fullname" . }}-canary
      stableService: {{ include "frontend.fullname" . }}-stable
      trafficRouting:
        {{- toYaml .Values.rollout.trafficRouting | nindent 8 }}
      {{- end }}
      steps:
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "frontend.fullname" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            {{- toYaml .Values.env | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
