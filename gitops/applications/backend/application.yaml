apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backend
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            branch: dev
          - env: test
            branch: test
          - env: perf
            branch: perf
          - env: staging
            branch: staging
          - env: production
            branch: main

  template:
    metadata:
      name: backend-{{ env }}
      namespace: argocd
    spec:
      project: default

      source:
        repoURL: https://github.com/RaymonSun1230/my-devops-project.git
        targetRevision: "{{ branch }}"
        path: helm-charts/backend
        helm:
          valueFiles:
            - $values/gitops/environments/{{ env }}/backend-values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: myapp-{{ env }}

{{- if ne "main" .branch }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
{{- end }}
