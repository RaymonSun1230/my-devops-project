apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: frontend
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev

  template:
    metadata:
      name: frontend-{{ env }}
      namespace: argocd
    spec:
      project: default

      source:
        repoURL: https://github.com/RaymonSun1230/my-devops-project.git
        targetRevision: main
        path: helm-charts/frontend
        helm:
          valueFiles:
            - $values/gitops/environments/{{ env }}/frontend-values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: myapp-{{ env }}

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
