apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backend
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: production
            branch: main

  template:
    metadata:
      name: backend-{{ env }}
      namespace: argocd
    spec:
      project: default

      source:
        repoURL: https://github.com/RaymonSun1230/my-devops-project.git
        targetRevision: "{{ branch }}"
        path: helm-charts/backend
        helm:
          valueFiles:
            - $values/gitops/environments/{{ env }}/backend-values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: myapp-{{ env }}
