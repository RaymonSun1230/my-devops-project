apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/RaymonSun1230/my-devops-project.git
      targetRevision: staging
      path: helm-charts/backend
      helm:
        valueFiles:
          - $values/gitops/staging/backend/values.yaml
    - repoURL: https://github.com/RaymonSun1230/my-devops-project.git
      targetRevision: staging
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
