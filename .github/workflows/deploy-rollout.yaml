name: Deploy Rollout Helper

on:
  workflow_call:
    inputs:
      action:
        description: "install / promote / rollback"
        required: true
        type: string
      environment:
        description: "Target environment (dev/test/staging/perf/production)"
        required: true
        type: string
      app:
        description: "backend / frontend"
        required: true
        type: string
      full_promote:
        description: "Canary only — skip to 100%"
        required: false
        type: boolean
        default: false

permissions: 
  id-token: write 
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_PREFIX: demo-app

jobs:
  rollout:
    name: ${{ inputs.action == 'install' && 'Install' || inputs.action == 'promote' && 'Promote' || 'Rollback' }} — ${{ inputs.app }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl argo rollouts plugin
        run: |
          curl -sSL https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64 \
            -o /usr/local/bin/kubectl-argo-rollouts
          chmod +x /usr/local/bin/kubectl-argo-rollouts
          kubectl argo rollouts version

      - name: Resolve branch & configure kubectl
        run: |
          case "${{ inputs.environment }}" in
            production) BRANCH="main" ;;
            *)          BRANCH="${{ inputs.environment }}" ;;
          esac
          CLUSTER="${{ env.CLUSTER_PREFIX }}-${BRANCH}"
          NAMESPACE="myapp-${{ inputs.environment }}"
          echo "NAMESPACE=${NAMESPACE}" >> "$GITHUB_ENV"
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "${CLUSTER}"

      # ── Install ──
      - name: "[Install] Wait for new ReplicaSet"
        if: ${{ inputs.action == 'install' }}
        run: |
          ROLLOUT="${{ inputs.app }}-${{ inputs.environment }}"
          echo "⏳ Waiting for new ReplicaSet..."
          for i in $(seq 1 60); do
            CURRENT_RS=$(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
              -o jsonpath='{.status.currentPodHash}' 2>/dev/null || echo "")
            STABLE_RS=$(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
              -o jsonpath='{.status.stableRS}' 2>/dev/null || echo "")
            if [[ -n "$CURRENT_RS" ]] && [[ "$CURRENT_RS" != "$STABLE_RS" ]]; then
              echo "✅ New ReplicaSet detected: $CURRENT_RS"
              break
            fi
            echo "⏳ Attempt $i/60..."
            sleep 10
          done

      - name: "[Install] Wait for pods ready"
        if: ${{ inputs.action == 'install' }}
        run: |
          ROLLOUT="${{ inputs.app }}-${{ inputs.environment }}"
          kubectl argo rollouts status "$ROLLOUT" -n "$NAMESPACE" --watch=false --timeout=300s
          echo "✅ Rollout pods ready!"

      # ── Promote ──
      - name: "[Promote] Promote Rollout"
        if: ${{ inputs.action == 'promote' }}
        run: |
          ROLLOUT="${{ inputs.app }}-${{ inputs.environment }}"
          if [[ "${{ inputs.full_promote }}" == "true" ]] && [[ "${{ inputs.app }}" == "frontend" ]]; then
            echo "🚀 Full promote: skipping canary to 100%..."
            for i in 1 2 3; do
              kubectl argo rollouts promote "$ROLLOUT" -n "$NAMESPACE" || true
              sleep 5
            done
          else
            echo "🚀 Promoting to next step..."
            kubectl argo rollouts promote "$ROLLOUT" -n "$NAMESPACE"
          fi

      - name: "[Promote] Wait for promotion to settle"
        if: ${{ inputs.action == 'promote' }}
        run: |
          ROLLOUT="${{ inputs.app }}-${{ inputs.environment }}"
          kubectl argo rollouts status "$ROLLOUT" -n "$NAMESPACE" --timeout=300s || true

      # ── Rollback ──
      - name: "[Rollback] Abort Rollout"
        if: ${{ inputs.action == 'rollback' }}
        run: |
          ROLLOUT="${{ inputs.app }}-${{ inputs.environment }}"
          echo "🛑 Aborting Rollout $ROLLOUT..."
          kubectl argo rollouts abort "$ROLLOUT" -n "$NAMESPACE"

      - name: "[Rollback] Wait for rollback to complete"
        if: ${{ inputs.action == 'rollback' }}
        run: |
          ROLLOUT="${{ inputs.app }}-${{ inputs.environment }}"
          kubectl argo rollouts status "$ROLLOUT" -n "$NAMESPACE" --timeout=300s || true

      # ── Final Status ──
      - name: Show final state
        run: |
          ROLLOUT="${{ inputs.app }}-${{ inputs.environment }}"
          echo "────────── Rollout Status ──────────"
          kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" -o wide 2>/dev/null || \
            echo "Rollout not found (may not be created yet)"
          echo ""
          echo "📍 Current step: $(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
            -o jsonpath='{.status.currentStepIndex}' 2>/dev/null || echo 'completed')"
          echo "📦 Stable RS: $(kubectl get rollout "$ROLLOUT" -n "$NAMESPACE" \
            -o jsonpath='{.status.stableRS}' 2>/dev/null || echo 'N/A')"
