name: CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        type: choice
        options:
          - install
          - promote
          - rollback
        default: install
      environment:
        description: "Target Environment"
        type: choice
        options:
          - dev
          - test
          - staging
          - perf
          - production
        default: dev
      app:
        description: "Application"
        type: choice
        options:
          - backend
          - frontend
        default: backend
      full_promote:
        description: "Full Promote (Canary only — skip to 100%)"
        type: boolean
        default: false

jobs:
  deploy:
    name: ${{ inputs.action }} — ${{ inputs.app }}
    uses: ./.github/workflows/deploy-rollout.yaml
    with:
      action: ${{ inputs.action }}
      environment: ${{ inputs.environment }}
      app: ${{ inputs.app }}
      full_promote: ${{ inputs.full_promote }}
