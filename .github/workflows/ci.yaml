name: CI

on:
  push:
    branches:
      - dev
      - test
    paths:
      - app/backend/**
      - app/frontend/**
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        type: choice
        options:
          - dev
          - test
          - staging
          - perf
          - production
        default: dev
      deploy_backend:
        description: "Deploy Backend"
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy Frontend"
        type: boolean
        default: true

permissions: 
  id-token: write 
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 385551094956.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_IMAGE: app-backend
  FRONTEND_IMAGE: app-frontend

jobs:
  resolve-branch:
    name: Resolve Target Branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}

    steps:
      - name: Resolve branch from environment
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              production) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            *)          
              echo "branch=${{ inputs.environment }}" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    name: Lint & Test
    needs: resolve-branch
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: 
          - backend
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.branch }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: app/${{ matrix.app }}
        run: uv sync --frozen

      - name: Install lint/test tools
        run: pip install ruff pytest

      - name: Lint with Ruff
        working-directory: app/${{ matrix.app }}
        run: ruff check --output-format=github

      - name: Test with pytest
        working-directory: app/${{ matrix.app }}
        run: python -m pytest -v --tb=short || echo "No tests found"

  build-and-push:
    name: Build & Push Docker Images
    needs: 
      - lint-and-test
      - resolve-branch
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-branch.outputs.branch }}

    strategy:
      matrix:
        include:
          - app: backend
            context: app/backend
            image: app-backend
            changed: backend

          - app: frontend
            context: app/frontend
            image: app-frontend
            changed: frontend
    
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: tag
        run: echo "IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)-$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          platforms: linux/arm64

          tags: |
            ${{ matrix.image }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.tag.outputs.IMAGE_TAG }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-values:
    name: Update Helm Values
    needs: 
      - build-and-push
      - resolve-branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.branch }}

      - name: Generate image tag
        id: tag
        run: echo "IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)-$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Resolve gitops env path
        id: envpath
        run: |
          echo "ENVIRONMENT=${{ needs.resolve-branch.outputs.branch }}" >> "$GITHUB_OUTPUT"

      - name: Update backend values
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_backend }}
        uses: mikefarah/yq@v4.45.1
        with:
          cmd: yq -i '.image.tag = "${{ steps.tag.outputs.IMAGE_TAG }}"' gitops/environments/${{ steps.envpath.outputs.env_dir }}/backend-values.yaml

      - name: Update frontend values
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_frontend }}
        uses: mikefarah/yq@v4.45.1
        with:
          cmd: yq -i '.image.tag = "${{ steps.tag.outputs.IMAGE_TAG }}"' gitops/environments/${{ steps.envpath.outputs.env_dir }}/frontend-values.yaml

      - name: Direct commit to branch
        if: ${{ needs.resolve-branch.outputs.branch == 'dev' || needs.resolve-branch.outputs.branch == 'test' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_user_name: "CI Bot"
          commit_user_email: "ci-bot@company.com"
          commit_message: "chore: update image tags to ${{ steps.tag.outputs.IMAGE_TAG }}"
          branch: ${{ needs.resolve-branch.outputs.branch }}
          file_pattern: gitops/environments/

      - name: Create Pull Request
        if: ${{ needs.resolve-branch.outputs.branch != 'dev' && needs.resolve-branch.outputs.branch != 'test' }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update image tags to ${{ steps.tag.outputs.IMAGE_TAG }}"
          committer: "CI Bot <ci-bot@company.com>"
          author: "CI Bot <ci-bot@company.com>"
          branch: ci/update-tags-${{ steps.tag.outputs.IMAGE_TAG }}
          base: ${{ needs.resolve-branch.outputs.branch }}
          title: "chore: update image tags to ${{ steps.tag.outputs.IMAGE_TAG }}"
          body: |
            Automated image tag update triggered by CI.

            | Component | Image |
            |---|---|
            | Backend | `${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}` |
            | Frontend | `${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}` |

            After merging, ArgoCD will automatically sync and Argo Rollouts will execute the deployment strategy.
          labels: automated-deploy
          delete-branch: true
