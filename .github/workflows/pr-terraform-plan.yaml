name: PR Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  detect:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed terraform modules
        id: detect
        run: |
          # Get changed files under terraform/ relative to base branch
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- terraform/ || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "No terraform files changed."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          MODULES_JSON="[]"
          while IFS= read -r FILE; do
            # Match: terraform/environments/<env>/<region>/<module-path>/...
            # Use a greedy capture to support multi-level modules (e.g. ecr/app-backend, s3/data-source)
            if [[ "$FILE" =~ ^terraform/environments/([^/]+)/([^/]+)/(.+) ]]; then
              ENV="${BASH_REMATCH[1]}"
              REGION="${BASH_REMATCH[2]}"
              MODULE_PATH="${BASH_REMATCH[3]}"

              # Extract the module directory (first component of remaining path)
              MODULE_DIR="${MODULE_PATH%%/*}"

              # Check if this is a simple module (terragrunt.hcl directly inside)
              if [[ -f "terraform/environments/$ENV/$REGION/$MODULE_DIR/terragrunt.hcl" ]]; then
                MODULES_JSON=$(echo "$MODULES_JSON" | jq --arg env "$ENV" --arg region "$REGION" --arg module "$MODULE_DIR" \
                  '. + [{"env": $env, "region": $region, "module": $module}]')
              fi

              # Also check for nested sub-modules (e.g. ecr/app-backend, s3/data-source)
              # Walk the path to find any parent dir that contains a terragrunt.hcl
              REMAINING="$MODULE_PATH"
              while [[ "$REMAINING" =~ / ]]; do
                PARENT="${REMAINING%/*}"
                if [[ -f "terraform/environments/$ENV/$REGION/$PARENT/terragrunt.hcl" ]]; then
                  MODULES_JSON=$(echo "$MODULES_JSON" | jq --arg env "$ENV" --arg region "$REGION" --arg module "$PARENT" \
                    '. + [{"env": $env, "region": $region, "module": $module}]')
                fi
                REMAINING="$PARENT"
              done
            fi
          done <<< "$CHANGED_FILES"

          # Deduplicate
          MODULES_JSON=$(echo "$MODULES_JSON" | jq 'unique_by(.env, .region, .module)')

          if [[ "$MODULES_JSON" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "No terraform module directories changed."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$MODULES_JSON" >> "$GITHUB_OUTPUT"
          echo "Detected modules:"
          echo "$MODULES_JSON" | jq '.'

  plan:
    name: "Terraform Plan — ${{ matrix.module }} (${{ matrix.env }}/${{ matrix.region }})"
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ matrix.region }}

      - name: Setup Terraform Plugin Cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles(format('terraform/environments/{0}/{1}/{2}/**/.terraform.lock.hcl', matrix.env, matrix.region, matrix.module)) }}

      - name: Setup Terragrunt & Terraform
        uses: gruntwork-io/terragrunt-action@v3

      - name: Set working directory
        id: wd
        run: echo "dir=terraform/environments/${{ matrix.env }}/${{ matrix.region }}/${{ matrix.module }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Terragrunt Init
        run: terragrunt init --non-interactive
        working-directory: ${{ steps.wd.outputs.dir }}

      - name: Terragrunt HCL Format
        run: terragrunt hclfmt --check
        working-directory: ${{ steps.wd.outputs.dir }}

      - name: Terragrunt Validate
        run: terragrunt validate
        working-directory: ${{ steps.wd.outputs.dir }}

      - name: Terragrunt Plan
        id: plan
        continue-on-error: true
        working-directory: ${{ steps.wd.outputs.dir }}
        run: |
          terragrunt plan --non-interactive -detailed-exitcode 2>&1 | tee /tmp/plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: ${{ steps.wd.outputs.dir }}
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          hide-progress: true

      - name: Save plan output & exit code
        id: save
        run: |
          EXIT_CODE=${{ steps.plan.outputs.exit_code }}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "$EXIT_CODE" > /tmp/exit_code.txt

          if [[ "$EXIT_CODE" == "0" ]]; then
            echo "status=✅ No changes" >> "$GITHUB_OUTPUT"
          elif [[ "$EXIT_CODE" == "2" ]]; then
            echo "status=📋 Changes detected" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ Error" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plan result
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.env }}-${{ matrix.region }}-${{ matrix.module }}
          path: |
            /tmp/plan_output.txt
            /tmp/exit_code.txt

  comment:
    name: Post PR Comment
    needs: [detect, plan]
    if: always() && needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all plan outputs
        uses: actions/download-artifact@v4
        with:
          pattern: plan-*
          path: /tmp/plan-results

      - name: Build PR comment
        id: build
        run: |
          COMMENT="## 🌍 Terraform Plan Results\n\n"
          COMMENT+="Triggered by PR #${{ github.event.pull_request.number }} on \`${{ github.base_ref }}\`\n\n"
          COMMENT+="| Module | Environment | Region | Status |\n"
          COMMENT+="|--------|-------------|--------|--------|\n"

          DETAILS=""

          # Iterate over matrix items
          for row in $(echo '${{ needs.detect.outputs.matrix }}' | jq -c '.[]'); do
            ENV=$(echo "$row" | jq -r '.env')
            REGION=$(echo "$row" | jq -r '.region')
            MODULE=$(echo "$row" | jq -r '.module')

            PLAN_DIR="/tmp/plan-results/plan-$ENV-$REGION-$MODULE"
            PLAN_FILE="$PLAN_DIR/plan_output.txt"
            EXIT_CODE_FILE="$PLAN_DIR/exit_code.txt"

            if [[ -f "$PLAN_FILE" ]]; then
              PLAN_TEXT=$(cat "$PLAN_FILE")

              # Determine status from exit code first, fall back to parsing output
              if [[ -f "$EXIT_CODE_FILE" ]]; then
                EXIT_CODE=$(cat "$EXIT_CODE_FILE")
                if [[ "$EXIT_CODE" == "0" ]]; then
                  STATUS="✅ No changes"
                elif [[ "$EXIT_CODE" == "2" ]]; then
                  STATUS="📋 Changes detected"
                else
                  STATUS="❌ Error"
                fi
              else
                # Fallback: detect status from plan output
                if echo "$PLAN_TEXT" | grep -q "No changes"; then
                  STATUS="✅ No changes"
                elif echo "$PLAN_TEXT" | grep -q "Terraform will perform"; then
                  STATUS="📋 Changes detected"
                elif echo "$PLAN_TEXT" | grep -q "Error:"; then
                  STATUS="❌ Error"
                else
                  STATUS="⚠️ Unknown"
                fi
              fi

              COMMENT+="| \`$MODULE\` | \`$ENV\` | \`$REGION\` | $STATUS |\n"

              # Extract meaningful lines
              SUMMARY=$(echo "$PLAN_TEXT" | grep -E "Plan:|No changes|to add|to change|to destroy|Error:" | head -5)
              DETAILS+="\n<details>\n<summary><b>$MODULE</b> ($ENV/$REGION) — $STATUS</summary>\n\n\`\`\`\n$SUMMARY\n\`\`\`\n\n<pre>\n$(echo "$PLAN_TEXT" | tail -100)\n</pre>\n</details>\n"
            else
              COMMENT+="| \`$MODULE\` | \`$ENV\` | \`$REGION\` | ⚠️ No output |\n"
            fi
          done

          COMMENT+="\n---\n"
          COMMENT+="$DETAILS"
          COMMENT+="\n<!-- terraform-pr-plan -->"

          # Save to file for posting
          echo -e "$COMMENT" > /tmp/pr_comment.md
          echo "Posted comment: /tmp/pr_comment.md"

      - name: Find existing comment
        id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- terraform-pr-plan -->'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: /tmp/pr_comment.md
          edit-mode: replace
