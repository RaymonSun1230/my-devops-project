name: Workflow - Deploy Rollout

on:
  workflow_call:
    inputs:
      action:
        description: "install / promote / rollback"
        required: true
        type: string
      environment:
        description: "Target environment (dev/test/staging/perf/production)"
        required: true
        type: string
      app:
        description: "backend / frontend"
        required: true
        type: string
permissions: 
  id-token: write 
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_PREFIX: demo-app

jobs:
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.resolve.outputs.namespace }}
      cluster: ${{ steps.resolve.outputs.cluster }}
      rollout: ${{ steps.resolve.outputs.rollout }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve cluster, namespace & rollout
        id: resolve
        run: |
          CLUSTER="${{ env.CLUSTER_PREFIX }}-${{ inputs.environment }}"
          NAMESPACE="myapp"
          ROLLOUT="${{ inputs.app }}"
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
          echo "rollout=$ROLLOUT" >> "$GITHUB_OUTPUT"
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "${CLUSTER}"

  install:
    name: "Install — ${{ inputs.app }}"
    if: ${{ inputs.action == 'install' }}
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl argo rollouts plugin
        run: |
          curl -sSL https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64 -o /usr/local/bin/kubectl-argo-rollouts
          chmod +x /usr/local/bin/kubectl-argo-rollouts

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} \
            --name ${{ needs.setup.outputs.cluster }}

      - name: Wait for rollout healthy
        run: |
          kubectl argo rollouts status "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}" \
            --watch --timeout=300s
          echo "✅ Rollout pods ready!"

  promote:
    name: "Promote — ${{ inputs.app }}"
    if: ${{ inputs.action == 'promote' }}
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'production-required-reviewers' || inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl argo rollouts plugin
        run: |
          curl -sSL https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64 -o /usr/local/bin/kubectl-argo-rollouts
          chmod +x /usr/local/bin/kubectl-argo-rollouts

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} \
            --name ${{ needs.setup.outputs.cluster }}

      - name: Promote Rollout
        run: |
          echo "🚀 Promoting to next step..."
          kubectl argo rollouts promote "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}"

      - name: Wait for promotion to settle
        run: |
          kubectl argo rollouts status "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}" --timeout=300s || true

      - name: Show final state
        run: |
          echo "────────── Rollout Status ──────────"
          kubectl get rollout "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}" -o wide 2>/dev/null || \
            echo "Rollout not found"
          echo ""
          echo "📍 Current step: $(kubectl get rollout "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}" \
            -o jsonpath='{.status.currentStepIndex}' 2>/dev/null || echo 'completed')"
          echo "📦 Stable RS: $(kubectl get rollout "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}" \
            -o jsonpath='{.status.stableRS}' 2>/dev/null || echo 'N/A')"

  rollback:
    name: "Rollback — ${{ inputs.app }}"
    if: ${{ inputs.action == 'rollback' }}
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl argo rollouts plugin
        run: |
          curl -sSL https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64 -o /usr/local/bin/kubectl-argo-rollouts
          chmod +x /usr/local/bin/kubectl-argo-rollouts

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} \
            --name ${{ needs.setup.outputs.cluster }}

      - name: Abort Rollout
        run: |
          echo "🛑 Aborting Rollout ${{ needs.setup.outputs.rollout }}..."
          kubectl argo rollouts abort "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}"

      - name: Wait for rollback to complete
        run: |
          kubectl argo rollouts status "${{ needs.setup.outputs.rollout }}" \
            -n "${{ needs.setup.outputs.namespace }}" --timeout=300s || true
