name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        type: choice
        options:
          - dev
          - test
          - staging
          - perf
          - production
        default: dev
      app:
        description: "Application"
        type: choice
        options:
          - backend
          - frontend
        default: backend
      tag:
        description: "Image tag to rollback to (e.g. v20260607-0215b15)"
        type: string
        required: true
      aws_region:
        description: "AWS Region"
        type: choice
        options:
          - us-east-1
          - us-east-2
        default: us-east-1

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  resolve-branch:
    name: Resolve Target Branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}

    steps:
      - name: Resolve branch from environment
        id: resolve
        run: |
          ENV="${{ inputs.environment }}"
          case "$ENV" in
            production) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            *)          echo "branch=$ENV" >> "$GITHUB_OUTPUT" ;;
          esac

  revert:
    name: "Revert ${{ inputs.app }} in ${{ inputs.environment }}"
    needs: resolve-branch
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.branch }}
          fetch-depth: 0

      - name: Determine values path & current tag
        id: paths
        run: |
          ENV="${{ inputs.environment }}"
          APP="${{ inputs.app }}"

          if [[ "$ENV" == "production" ]]; then
            VALUES_PATH="gitops/production/us-east-1/${APP}/values.yaml"
            VALUES_PATH_2="gitops/production/us-east-2/${APP}/values.yaml"
          else
            VALUES_PATH="gitops/${ENV}/${APP}/values.yaml"
            VALUES_PATH_2=""
          fi

          CURRENT_TAG=$(yq '.image.tag' "${VALUES_PATH}")
          echo "VALUES_PATH=${VALUES_PATH}" >> "$GITHUB_OUTPUT"
          echo "VALUES_PATH_2=${VALUES_PATH_2}" >> "$GITHUB_OUTPUT"
          echo "CURRENT_TAG=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if tag is different
        id: check
        run: |
          CURRENT_TAG="${{ steps.paths.outputs.CURRENT_TAG }}"
          TARGET_TAG="${{ inputs.tag }}"
          if [[ "$CURRENT_TAG" == "$TARGET_TAG" ]]; then
            echo "⚠ image.tag is already ${TARGET_TAG}, nothing to rollback"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "↩ Rolling back from ${CURRENT_TAG} to ${TARGET_TAG}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revert image tag
        if: ${{ steps.check.outputs.changed == 'true' }}
        run: |
          APP="${{ inputs.app }}"
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.tag }}"
          VALUES_PATH="${{ steps.paths.outputs.VALUES_PATH }}"
          VALUES_PATH_2="${{ steps.paths.outputs.VALUES_PATH_2 }}"

          echo "↩ Reverting ${APP} in ${ENV} to image tag: ${TAG}"
          yq -i ".image.tag = \"${TAG}\"" "${VALUES_PATH}"
          [[ -n "$VALUES_PATH_2" ]] && yq -i ".image.tag = \"${TAG}\"" "${VALUES_PATH_2}"

      - name: Direct commit to branch (dev/test)
        if: ${{ steps.check.outputs.changed == 'true' && (needs.resolve-branch.outputs.branch == 'dev' || needs.resolve-branch.outputs.branch == 'test') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(rollback): revert ${{ inputs.app }} in ${{ inputs.environment }} to ${{ inputs.tag }}"
          branch: ${{ needs.resolve-branch.outputs.branch }}
          file_pattern: gitops/

      - name: Create Pull Request (staging/perf/production)
        if: ${{ steps.check.outputs.changed == 'true' && needs.resolve-branch.outputs.branch != 'dev' && needs.resolve-branch.outputs.branch != 'test' }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(rollback): revert ${{ inputs.app }} in ${{ inputs.environment }} to ${{ inputs.tag }}"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: rollback/${{ inputs.app }}-${{ inputs.tag }}
          base: ${{ needs.resolve-branch.outputs.branch }}
          title: "chore(rollback): revert ${{ inputs.app }} in ${{ inputs.environment }} to ${{ inputs.tag }}"
          body: |
            ## Rollback Request

            | | |
            |---|---|
            | **Environment** | ${{ inputs.environment }} |
            | **Application** | ${{ inputs.app }} |
            | **Rollback to** | `${{ inputs.tag }}` |

            After merging, run the [CD workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/cd.yaml) to deploy and promote.
          labels: automated-deploy
          delete-branch: true
