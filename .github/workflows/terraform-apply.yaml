name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        type: choice
        options:
          - plan
          - apply
        default: plan
      environment:
        description: "Target Environment"
        type: choice
        options:
          - dev
          - staging
          - test
          - perf
          - production
        default: dev
      aws_region:
        description: "AWS Region (use 'global' for IAM, Route53)"
        type: choice
        options:
          - us-east-1
          - us-east-2
          - global
        default: us-east-1
      resources:
        description: "Terraform Modules to Target"
        type: choice
        options:
          - all
          - vpc
          - eks
          - iam/alb-controller
          - iam/app-backend
          - iam/s3-replication
          - s3/data-source
          - ecr/app-frontend
          - ecr/app-backend
          - acm
          - route53
          - waf
          - argocd
        default: all

permissions: 
  id-token: write 
  contents: read

concurrency: 
  group: terraform-${{ inputs.environment }}-${{ inputs.aws_region }} 
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

jobs:
  plan:
    name: "Terraform Plan — ${{ inputs.environment }}/${{ inputs.aws_region }}/${{ inputs.resources }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      target_dir: ${{ steps.resolve.outputs.target_dir }}
      tg_command: ${{ steps.resolve.outputs.tg_command }}
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ inputs.aws_region == 'global' && 'us-east-1' || inputs.aws_region }}

      - name: Setup Terraform Plugin Cache
        run: mkdir -p /home/runner/.terraform.d/plugin-cache

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terragrunt & Terraform
        uses: gruntwork-io/terragrunt-action@v3

      - name: Resolve target directory
        id: resolve
        run: |
          # Use 'global/' for global resources, otherwise use the selected region
          if [[ "${{ inputs.aws_region }}" == "global" ]]; then
            TARGET_REGION="global"
          else
            TARGET_REGION="${{ inputs.aws_region }}"
          fi

          PLAN_FILE="${GITHUB_WORKSPACE}/tfplan-${{ github.run_id }}"
          if [[ "${{ inputs.resources }}" == "all" ]]; then
            echo "target_dir=terraform/environments/${{ inputs.environment }}/$TARGET_REGION" >> "$GITHUB_OUTPUT"
            echo "tg_command=run --all" >> "$GITHUB_OUTPUT"
            echo "plan_out_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "target_dir=terraform/environments/${{ inputs.environment }}/$TARGET_REGION/${{ inputs.resources }}" >> "$GITHUB_OUTPUT"
            echo "tg_command=" >> "$GITHUB_OUTPUT"
            echo "plan_out_flag=-out=$PLAN_FILE" >> "$GITHUB_OUTPUT"
            echo "plan_file=$PLAN_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Terragrunt Init
        run: |
          terragrunt ${{ steps.resolve.outputs.tg_command }} init \
            --non-interactive
        working-directory: ${{ steps.resolve.outputs.target_dir }}

      - name: "Terragrunt Plan"
        id: plan
        run: |
          set +e
          terragrunt ${{ steps.resolve.outputs.tg_command }} plan \
            --non-interactive \
            -- \
            -detailed-exitcode \
            ${{ steps.resolve.outputs.plan_out_flag }}
          exit_code=$?
          set -e

          if [[ $exit_code -eq 2 ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [[ $exit_code -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Plan failed with exit code $exit_code" >&2
            exit $exit_code
          fi
        working-directory: ${{ steps.resolve.outputs.target_dir }}

      - name: Upload Plan Artifact
        if: inputs.action == 'apply' && inputs.resources != 'all' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ steps.resolve.outputs.plan_file }}

  apply:
    name: "Terraform Apply — ${{ inputs.environment }}/${{ inputs.aws_region }}/${{ inputs.resources }}"
    if: inputs.action == 'apply' && needs.plan.outputs.has_changes == 'true'
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-required-reviewers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ inputs.aws_region == 'global' && 'us-east-1' || inputs.aws_region }}

      - name: Setup Terraform Plugin Cache
        run: mkdir -p /home/runner/.terraform.d/plugin-cache

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
      
      - name: Resolve target directory
        id: resolve
        run: |
          # Use 'global/' for global resources, otherwise use the selected region
          if [[ "${{ inputs.aws_region }}" == "global" ]]; then
            TARGET_REGION="global"
          else
            TARGET_REGION="${{ inputs.aws_region }}"
          fi

          if [[ "${{ inputs.resources }}" == "all" ]]; then
            echo "target_dir=terraform/environments/${{ inputs.environment }}/$TARGET_REGION" >> "$GITHUB_OUTPUT"
            echo "tg_command=run --all" >> "$GITHUB_OUTPUT"
            echo "action=apply" >> "$GITHUB_OUTPUT"
          else
            echo "target_dir=terraform/environments/${{ inputs.environment }}/$TARGET_REGION/${{ inputs.resources }}" >> "$GITHUB_OUTPUT"
            echo "tg_command=" >> "$GITHUB_OUTPUT"
            echo "action=apply tfplan-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Plan Artifact
        if: inputs.resources != 'all'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ steps.resolve.outputs.target_dir }}

      - name: Terraform Apply
        run: |
          terragrunt ${{ steps.resolve.outputs.tg_command }} ${{ steps.resolve.outputs.action }} \
            --non-interactive \
            -- \
            -auto-approve
        working-directory: ${{ steps.resolve.outputs.target_dir }}
